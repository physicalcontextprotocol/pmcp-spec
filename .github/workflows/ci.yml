name: pmcp-spec CI

# The specification repository. Two things are worth checking
# automatically, and both are about the spec contradicting itself:
#
#   1. The JSON Schema must still be a valid JSON Schema 2020-12
#      document, and every example under schema/v0.6.0/examples/ must
#      still validate or fail as its filename claims.
#   2. The TLA+ models must still model-check. `formal/` ships
#      deliberately mutated copies of both specs under
#      `formal/self-test/`; TLC must REJECT those. A model checker that
#      passes a mutated spec is worse than no model checker, because it
#      manufactures false confidence — which is precisely the failure
#      mode a safety specification cannot afford.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  schema:
    name: JSON Schema + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate the schema and round-trip the examples
        run: python schema/v0.6.0/verify.py

      # The script above checks that each `invalid/` fixture is rejected
      # *for the reason it claims to probe*, not merely rejected. That
      # distinction has already caught one real false-confidence bug:
      # `lease_grant_bad_state.json` was being rejected only because it
      # omitted the required `fence_token`, so it appeared to prove
      # `LeaseState` was enforced while proving nothing of the sort.

  # ===========================================================================
  # Formal model checking.
  #
  # This job used to be `runs-on: [self-hosted, tla]` behind
  # `if: ${{ false }}`, on the stated grounds that "TLC needs a JDK, and
  # the full sweep is slow enough to need a real runner". Both halves of
  # that turned out to be wrong: TLC ships as a single Java jar (class
  # file major 55, so any JDK 11+), and the whole four-model sweep
  # completes in under two seconds. It ran green on a stock laptop.
  #
  # So this now runs on an ordinary GitHub-hosted runner. The jar is
  # version-pinned and checksum-verified rather than fetched loosely --
  # a safety gate that depends on an unverified download is not a gate.
  #
  # The job is still deliberately NOT made to pass by skipping. If TLC
  # cannot be obtained, the outcome is a red X saying "the models were
  # not re-checked", never a green tick.
  # ===========================================================================
  tla:
    name: TLA+ model check (+ mutant self-test)
    runs-on: ubuntu-latest
    env:
      # Pinned: tla2tools v1.8.0
      TLA_VERSION: "1.8.0"
      TLA_SHA256: "ab4694601923fd5ac06452abbf847c366a5054a3d739552085edd6ed986c29ec"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch TLC and verify its checksum
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  tla2tools.jar" | sha256sum -c -
          echo "TLC v${TLA_VERSION} verified"

      - name: Check PMCPCore
        run: java -cp tla2tools.jar tlc2.TLC -workers auto -config formal/PMCPCore.cfg formal/PMCPCore.tla

      - name: Check PMCPRecovery
        run: java -cp tla2tools.jar tlc2.TLC -workers auto -config formal/PMCPRecovery.cfg formal/PMCPRecovery.tla

      - name: Self-test — TLC must REJECT the deliberately mutated specs
        run: |
          # These are the whole point of the self-test. If TLC reports
          # success on a mutant, the checker is not actually checking,
          # and every "verified" claim that rests on it is void.
          #
          # The two commands below are EXPECTED TO FAIL. A non-zero exit
          # is the pass condition.
          set +e
          java -cp tla2tools.jar tlc2.TLC -workers auto \
            -config formal/self-test/PMCPCore_mutant.cfg \
                     formal/self-test/PMCPCore_mutant.tla
          if [ $? -eq 0 ]; then
            echo "::error::TLC accepted a deliberately mutated spec."
            echo "::error::The model checker is not validating. Do not trust"
            echo "::error::any verification claim until this is fixed."
            exit 1
          fi
          echo "TLC correctly rejected the mutated PMCPCore model"

          java -cp tla2tools.jar tlc2.TLC -workers auto \
            -config formal/self-test/PMCPRecovery_mutant.cfg \
                     formal/self-test/PMCPRecovery_mutant.tla
          if [ $? -eq 0 ]; then
            echo "::error::TLC accepted a deliberately mutated spec."
            exit 1
          fi
          echo "TLC correctly rejected the mutated PMCPRecovery model"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [schema, tla]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## pmcp-spec CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| schema | ${{ needs.schema.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tla    | ${{ needs.tla.result }}    |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.tla.result }}" != "success" ]; then
            echo "> **The TLA+ models were NOT verified by this run.**" >> "$GITHUB_STEP_SUMMARY"
            echo "> Treat every formal claim as unverified until \`tla\` is green." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The \`tla\` job also proves TLC rejects both deliberately" >> "$GITHUB_STEP_SUMMARY"
            echo "mutated specs, so a green tick means the checker is not" >> "$GITHUB_STEP_SUMMARY"
            echo "passing vacuously." >> "$GITHUB_STEP_SUMMARY"
          fi
